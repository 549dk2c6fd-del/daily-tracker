<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFBFD" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="轻盈日记" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="180x180" href="touch-icon.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<title>轻盈日记 · 我的减肥工作台</title>
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23FFE6ED'/%3E%3Cpath d='M30 70c0-26 17-38 42-38 0 25-15 40-36 40' fill='none' stroke='%23FFAFC5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M31 71l20-20' stroke='%23FFAFC5' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
:root{
  --pink:#FFAFC5;
  --pink-2:#FFC9D8;
  --pink-soft:#FFE6ED;
  --pink-mist:#FFF6F9;
  --blue:#A6C8F2;
  --blue-2:#C6DDFB;
  --blue-soft:#E5F0FF;
  --blue-mist:#F4F9FF;
  --mint:#B6E2CF;
  --butter:#FFE7B3;
  --lilac:#DCD6F7;
  --ink:#454754;
  --ink-2:#7B7E90;
  --ink-3:#AAADBE;
  --line:#F0EBF2;
  --card:#FFFFFF;
  --shadow:0 10px 28px rgba(130,140,180,.10);
  --shadow-sm:0 4px 14px rgba(130,140,180,.08);
  --r-xl:26px;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#FFF9FB}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;color:var(--ink);
  background:#FFF9FB;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(260px 260px at 8% -2%, rgba(255,213,226,.75), transparent 72%),
    radial-gradient(300px 300px at 100% 18%, rgba(206,228,255,.72), transparent 74%),
    radial-gradient(240px 240px at 78% 96%, rgba(255,238,213,.55), transparent 72%),
    linear-gradient(178deg,#FFF9FB 0%,#FDF7FA 40%,#F4F9FF 100%);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::selection{background:var(--pink-soft)}

/* ---------- 布局 ---------- */
.phone{position:relative;z-index:1;max-width:462px;margin:0 auto;padding:0 17px calc(110px + var(--safe-b))}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 2px 12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg,#FFFBFD 0%,#FFFBFD 74%,rgba(255,251,253,0) 100%);
  margin-bottom:2px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;
  background:#fff;box-shadow:var(--shadow-sm);
  display:grid;place-items:center;color:var(--pink);
  border:1.5px solid #fff;
}
.brand-mark svg{width:24px;height:24px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);letter-spacing:.2px}
.icon-btn{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;
  background:#fff;box-shadow:var(--shadow-sm);color:var(--ink-2);border:1.5px solid #fff;
  transition:transform .15s ease;
}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px}

.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用卡片 ---------- */
.card{
  background:var(--card);border-radius:var(--r-lg);
  padding:17px 17px 16px;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.9);
  position:relative;overflow:hidden;
}
.card + .card{margin-top:13px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.1px}
.card-title svg{width:17px;height:17px;color:var(--pink);flex:0 0 17px}
.card-sub{font-size:11.5px;color:var(--ink-3)}
.link-btn{font-size:12.5px;color:var(--pink);font-weight:600;padding:4px 2px}
.link-btn:active{opacity:.6}
.muted{color:var(--ink-3)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 20px;border-radius:15px;font-weight:700;font-size:14.5px;
  transition:transform .14s ease,box-shadow .14s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,#FFC4D4,#FFA8C1);color:#7A3247;box-shadow:0 8px 18px rgba(255,168,193,.38)}
.btn-blue{background:linear-gradient(135deg,#D3E6FF,#B6D3FA);color:#33517A;box-shadow:0 8px 18px rgba(166,200,242,.35)}
.btn-ghost{background:var(--pink-mist);color:#A9546C}
.btn-ghost-b{background:var(--blue-mist);color:#4A6B96}
.btn-line{background:#fff;color:var(--ink-2);border:1.5px dashed var(--line)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px}
.btn-full{width:100%}
.btn[disabled]{opacity:.5}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(140deg,#FFFFFF 0%,#FFF7FA 52%,#F2F8FF 100%);
  border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  border:1px solid #fff;
}
.hero::before{
  content:"";position:absolute;right:-52px;top:-58px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%, rgba(198,221,251,.55), rgba(198,221,251,0) 70%);
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;left:-46px;bottom:-64px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 62% 38%, rgba(255,201,216,.45), rgba(255,201,216,0) 70%);
  pointer-events:none;
}
.hero > *{position:relative;z-index:1}
.hero-label{font-size:12px;color:var(--ink-3);letter-spacing:.4px}
.hero-weight{display:flex;align-items:flex-end;gap:7px;margin:2px 0 3px}
.hero-num{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-unit{font-size:14px;color:var(--ink-3);font-weight:600;padding-bottom:8px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--blue-mist);color:#4A6B96}
.delta.down{background:#EAF7F1;color:#3C8A6A}
.delta.up{background:#FFF0F3;color:#B8526E}
.delta svg{width:12px;height:12px}
.hero-actions{display:flex;gap:9px;margin-top:15px}
.hero-actions .btn{flex:1}

.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat4 .s{background:rgba(255,255,255,.75);border-radius:14px;padding:9px 6px;text-align:center}
.stat4 .s b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.stat4 .s span{font-size:10.5px;color:var(--ink-3)}

/* 环形进度 */
.ring-wrap{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:#F3EDF1;stroke-width:10;stroke-linecap:round}
.ring-bar{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring-txt b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.ring-txt span{font-size:10px;color:var(--ink-3);display:block;margin-top:2px}
.ring-sm{width:64px;height:64px;flex:0 0 64px}
.ring-sm .ring-txt b{font-size:14px}
.ring-sm .ring-txt span{font-size:9px}

.kcal-rows{flex:1;min-width:0}
.kcal-row{display:flex;align-items:baseline;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kcal-row:last-child{border-bottom:none}
.kcal-row b{font-variant-numeric:tabular-nums;font-weight:700}
.kcal-row span{color:var(--ink-3)}

/* 今日打卡 */
.today-habit{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.today-habit:last-child{border-bottom:none;padding-bottom:2px}
.check{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid var(--blue-2);
  display:grid;place-items:center;background:#fff;transition:.16s ease;color:#fff;
}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.16s ease}
.check.on{background:linear-gradient(135deg,#BCD8FA,#9EC3F3);border-color:#9EC3F3}
.check.on svg{opacity:1;transform:none}
.today-habit .name{font-size:14px;font-weight:600}
.today-habit .meta{font-size:11px;color:var(--ink-3)}
.today-habit.done .name{color:var(--ink-3);text-decoration:line-through}

/* 今日三餐 */
.meal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meal-mini{text-align:center;cursor:pointer}
.meal-thumb{
  width:100%;aspect-ratio:1;border-radius:14px;background:var(--pink-mist);
  display:grid;place-items:center;overflow:hidden;border:1.5px dashed #F3DEE6;color:#E3B9C8;
  position:relative;
}
.meal-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meal-thumb svg{width:22px;height:22px}
.meal-mini .t{font-size:11px;color:var(--ink-2);margin-top:5px;font-weight:600}
.meal-mini .k{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 体重页 ---------- */
.chart-box{margin:2px -4px -2px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart-empty{height:152px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3);font-size:12.5px;text-align:center;line-height:1.7}
.chart-empty svg{width:38px;height:38px;color:#DED7E3;margin-bottom:2px}
.wlist{margin-top:4px}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:0 0 7px}
.wrow .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px}
.wrow .dt{font-size:12px;color:var(--ink-3);flex:1}
.wrow .chg{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--blue-mist);color:#4A6B96}
.mini-x{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);background:#FAF7FA}
.mini-x svg{width:14px;height:14px}

/* ---------- 饮食页 ---------- */
.datestrip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:var(--r-md);padding:8px 10px;box-shadow:var(--shadow-sm);margin-bottom:13px}
.datestrip .d{font-size:13.5px;font-weight:700}
.datestrip .d span{font-size:11px;color:var(--ink-3);font-weight:500;margin-left:6px}
.nav-arrow{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--pink-mist);color:#B5718A}
.nav-arrow:active{transform:scale(.94)}
.nav-arrow svg{width:16px;height:16px}
.meal-card{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed var(--line)}
.meal-card:last-of-type{border-bottom:none}
.meal-photo{
  width:78px;height:78px;flex:0 0 78px;border-radius:16px;overflow:hidden;background:var(--blue-mist);
  border:1.5px dashed #D8E6F8;display:grid;place-items:center;color:#B9CDE6;cursor:pointer;position:relative;
}
.meal-photo img{width:100%;height:100%;object-fit:cover;display:block}
.meal-photo svg{width:24px;height:24px}
.meal-photo .rec{position:absolute;bottom:0;left:0;right:0;font-size:9px;background:rgba(69,71,84,.55);color:#fff;text-align:center;padding:1px 0;letter-spacing:.3px}
.meal-body{flex:1;min-width:0}
.meal-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.meal-name i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:500;background:#FAF7FA;padding:1px 7px;border-radius:20px}
.meal-note{font-size:12px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:0}
.meal-kcal{font-size:12.5px;font-weight:700;color:#B5718A;font-variant-numeric:tabular-nums;margin-top:5px}
.meal-kcal.empty{color:var(--ink-3);font-weight:500}
.meal-total{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:13px;border-top:1.5px dashed var(--line);font-size:13px}
.meal-total b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- 打卡页 ---------- */
.habit-week{display:grid;grid-template-columns:1fr repeat(7,30px);gap:6px;align-items:center}
.hw-head{font-size:10px;color:var(--ink-3);text-align:center;line-height:1.2}
.hw-head b{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
.hw-head.now b{color:var(--pink)}
.hw-name{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:5px 0;min-width:0}
.hw-name svg{width:16px;height:16px;flex:0 0 16px;color:#B5718A}
.hw-name span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hw-name em{font-style:normal;font-size:9.5px;color:var(--ink-3);font-weight:500}
.cell{width:30px;height:30px;border-radius:10px;background:#FAF7FA;display:grid;place-items:center;color:transparent;transition:.15s ease;border:1.5px solid transparent}
.cell svg{width:13px;height:13px}
.cell.on{background:linear-gradient(135deg,#FFD3E0,#FFBBCE);color:#fff}
.cell.today{box-shadow:0 0 0 2px #DCEBFF inset}
.cell.future{opacity:.4}
.habit-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.habit-row:last-child{border-bottom:none}
.habit-row .nm{font-size:13.5px;font-weight:600}
.habit-row .tg{font-size:11px;color:var(--ink-3)}

/* ---------- 成就页 ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{
  aspect-ratio:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:#FAF8FB;border:1.5px dashed #EDE7EF;color:#C9C5D2;position:relative;overflow:hidden;
}
.badge svg{width:26px;height:26px}
.badge b{font-size:10.5px;font-weight:700;line-height:1.1;text-align:center;padding:0 3px}
.badge small{font-size:9px;color:var(--ink-3)}
.badge.on{background:linear-gradient(150deg,#FFF1F5,#F1F7FF);border:1.5px solid #FFDDE7;color:#A9546C;box-shadow:0 6px 14px rgba(255,175,197,.18)}
.badge.on svg{color:#E88AA6}
.badge.on small{color:#B5718A}
.badge.locked svg{opacity:.45}
.progress{height:9px;border-radius:20px;background:#F2EDF1;overflow:hidden}
.progress i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#FFD0DE,#C4DCFB);transition:width .5s ease}

/* ---------- 周报页 ---------- */
.score-hero{display:flex;align-items:center;gap:16px}
.score-ring{position:relative;width:104px;height:104px;flex:0 0 104px}
.score-ring .ring-txt b{font-size:28px;letter-spacing:-1px}
.score-meta{flex:1;min-width:0}
.score-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#EAF7F1;color:#3C8A6A;margin-bottom:5px}
.dim{margin-top:10px}
.dim-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
.dim-top b{font-variant-numeric:tabular-nums}
.dim .progress{height:6px}
.report-block{font-size:13.5px;color:var(--ink);line-height:1.75}
.report-block p{margin:0 0 9px}
.report-block p:last-child{margin-bottom:0}
.report-block strong{color:#A9546C;font-weight:700}
.tips{list-style:none;padding:0;margin:0}
.tips li{display:flex;gap:9px;font-size:13px;line-height:1.65;padding:7px 0;border-bottom:1px dashed var(--line)}
.tips li:last-child{border-bottom:none}
.tips .n{width:19px;height:19px;flex:0 0 19px;border-radius:7px;background:var(--blue-soft);color:#4A6B96;font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.ai-out{font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.ai-out:empty{display:none}
.spinner{width:15px;height:15px;border:2px solid rgba(122,50,71,.25);border-top-color:#7A3247;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
  padding:0 10px calc(4px + var(--safe-b));
  background:linear-gradient(180deg,rgba(255,250,252,0),rgba(255,250,252,.92) 38%);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.tabbar-inner{width:100%;max-width:430px;display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.94);border-radius:24px;box-shadow:0 10px 30px rgba(130,140,180,.16);
  padding:6px 4px;border:1px solid #fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--ink-3);position:relative;transition:.15s}
.tab svg{width:22px;height:22px}
.tab span{font-size:9.5px;font-weight:600;letter-spacing:.2px}
.tab.on{color:#B2526F}
.tab.on::before{content:"";position:absolute;top:-7px;width:16px;height:3px;border-radius:3px;background:linear-gradient(90deg,#FFC0D2,#C3DBFA)}
.tab:active{transform:scale(.94)}

/* ---------- 弹层 ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(60,58,72,.32);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s ease}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:462px;margin:0 auto;background:#fff;
  border-radius:28px 28px 0 0;padding:10px 18px calc(18px + var(--safe-b));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
  max-height:88vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(90,90,120,.18);
}
.sheet.on{transform:none}
.sheet-handle{width:38px;height:4px;border-radius:4px;background:#EDE7EF;margin:2px auto 14px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.sheet .sheet-sub{margin:0 0 16px;font-size:12px;color:var(--ink-3)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.input{
  width:100%;height:48px;border-radius:15px;border:1.5px solid #F0EBF2;background:#FDFBFD;
  padding:0 14px;font-size:16px;outline:none;transition:.16s;
}
.input:focus{border-color:#FFC9D8;background:#fff;box-shadow:0 0 0 4px rgba(255,201,216,.22)}
textarea.input{height:auto;min-height:76px;padding:12px 14px;resize:vertical;line-height:1.6}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.hint{font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;padding:8px 13px;border-radius:13px;background:#FAF7FA;font-size:13px;font-weight:600;color:var(--ink-2);border:1.5px solid transparent}
.chip svg{width:17px;height:17px;flex:0 0 17px}
.chip.on{background:#FFF1F5;color:#A9546C;border-color:#FFD9E3}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{flex:1}
.photo-picker{display:flex;gap:10px;align-items:center}
.photo-preview{width:64px;height:64px;border-radius:14px;overflow:hidden;background:#FAF7FA;display:grid;place-items:center;color:var(--ink-3);flex:0 0 64px}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview svg{width:20px;height:20px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  background:rgba(69,71,84,.94);color:#fff;font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:16px;z-index:60;opacity:0;pointer-events:none;
  transition:.24s ease;box-shadow:0 10px 24px rgba(60,60,90,.24);max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:22px 10px;color:var(--ink-3);font-size:12.5px;line-height:1.8}
.empty svg{width:44px;height:44px;color:#E9E3ED;margin-bottom:8px}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--blue-mist);color:#4A6B96;font-weight:600}
.tag.pink{background:var(--pink-mist);color:#A9546C}
</style>

/* ================= 工具 ================= */
const KEY = 'qingying.fitmate.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const mdLabel = s => { const d = parseD(s); return (d.getMonth()+1) + '月' + d.getDate() + '日'; };
const shortLabel = s => { const d = parseD(s); return (d.getMonth()+1) + '/' + d.getDate(); };
const weekStart = s => { const d = parseD(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };
const weekDates = start => Array.from({length:7}, (_,i) => addDays(start, i));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1900);
}

let S = DEFAULT();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d === 'object'){
      S = Object.assign(DEFAULT(), d);
      S.profile = Object.assign(DEFAULT().profile, d.profile || {});
      S.ai = Object.assign({base:'',key:'',model:''}, d.ai || {});
      S.weights = Array.isArray(d.weights) ? d.weights : [];
      S.habits = Array.isArray(d.habits) ? d.habits : DEFAULT().habits;
      S.meals = d.meals && typeof d.meals === 'object' ? d.meals : {};
      S.checkins = d.checkins && typeof d.checkins === 'object' ? d.checkins : {};
    }
  }catch(e){ console.warn('读取数据失败', e); }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    return true;
  }catch(e){
    console.warn('保存失败', e);
    toast('存储空间不足，请删掉一些旧餐食照片');
    return false;
  }
}

function normFood(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[\s,，。、;；:：!！?？()（）\[\]【】\-_/\\·"'”“]/g, '');
}

/* 按菜名找最匹配的一条；返回 { name, portion, kcal, hit } */
function lookupFood(text){
  const q = normFood(text);
  if(!q || q.length < 2) return null;
  let best = null, bestLen = 0;
  for(let i = 0; i < FOOD_DB.length; i++){
    const it = FOOD_DB[i];
    const names = [it[0]].concat(it[3] || []);
    for(let j = 0; j < names.length; j++){
      const nn = normFood(names[j]);
      if(!nn) continue;
      if(q === nn){
        if(nn.length > bestLen || !best){
          best = { name: it[0], portion: it[1], kcal: it[2], hit: names[j], exact: true };
          bestLen = nn.length;
        }
      }else if(nn.length >= 2 && q.indexOf(nn) > -1 && nn.length > bestLen && !(best && best.exact)){
        best = { name: it[0], portion: it[1], kcal: it[2], hit: names[j], exact: false };
        bestLen = nn.length;
      }
    }
  }
  return best;
}

/* 在整段描述里找出所有食物，按长匹配优先去重叠，累加热量 */
function estimateFoods(text){
  const q = normFood(text);
  if(!q || q.length < 2) return [];
  const cands = [];
  for(let i = 0; i < FOOD_DB.length; i++){
    const it = FOOD_DB[i];
    const names = [it[0]].concat(it[3] || []);
    for(let j = 0; j < names.length; j++){
      const nn = normFood(names[j]);
      if(nn.length < 2) continue;
      let idx = q.indexOf(nn);
      while(idx > -1){
        cands.push({ start: idx, end: idx + nn.length, len: nn.length, name: it[0], portion: it[1], kcal: it[2] });
        idx = q.indexOf(nn, idx + 1);
      }
    }
  }
  if(!cands.length) return [];
  cands.sort((a, b) => (b.len - a.len) || (a.start - b.start));
  const used = [];
  const picked = [];
  for(let i = 0; i < cands.length; i++){
    const c = cands[i];
    let overlap = false;
    for(let j = 0; j < used.length; j++){
      if(c.start < used[j].end && c.end > used[j].start){ overlap = true; break; }
    }
    if(!overlap){ used.push(c); picked.push(c); }
  }
  picked.sort((a, b) => a.start - b.start);
  const seen = {}, out = [];
  for(let i = 0; i < picked.length; i++){
    const p = picked[i];
    if(seen[p.name]) continue;
    seen[p.name] = 1;
    out.push({ name: p.name, portion: p.portion, kcal: p.kcal });
  }
  return out;
}

function dayMeals(date){
  const d = S.meals[date] || {};
  return {
    breakfast: d.breakfast || null,
    lunch: d.lunch || null,
    dinner: d.dinner || null,
    snacks: Array.isArray(d.snacks) ? d.snacks : []
  };
}
function mealKcal(m){
  if(!m) return 0;
  if(Array.isArray(m)) return m.reduce((a, x) => a + num(x.kcal), 0);
  return num(m.kcal);
}
function dayKcal(date){
  const d = dayMeals(date);
  return mealKcal(d.breakfast) + mealKcal(d.lunch) + mealKcal(d.dinner) + mealKcal(d.snacks);
}
function dayMealCount(date){
  const d = dayMeals(date);
  let n = 0;
  ['breakfast','lunch','dinner'].forEach(k => { if(d[k] && (d[k].photo || d[k].note || num(d[k].kcal))) n++; });
  if(d.snacks.length) n++;
  return n;
}
function sortedWeights(){
  return S.weights.slice().sort((a,b) => a.d === b.d ? (a.t||0)-(b.t||0) : (a.d < b.d ? -1 : 1));
}
function latestWeight(){
  const a = sortedWeights();
  return a.length ? a[a.length-1] : null;
}
function weightOn(date){
  const a = S.weights.filter(w => w.d === date);
  return a.length ? a[a.length-1] : null;
}
function prevWeight(date){
  const a = sortedWeights().filter(w => w.d < date);
  return a.length ? a[a.length-1] : null;
}
function startWeight(){
  if(S.profile.start) return num(S.profile.start);
  const a = sortedWeights();
  return a.length ? num(a[0].kg) : null;
}
function lowestWeight(){
  const a = sortedWeights();
  if(!a.length) return null;
  return Math.min.apply(null, a.map(w => num(w.kg)));
}
function latestKg(){
  const l = latestWeight();
  if(l) return num(l.kg);
  return startWeight();
}
function totalLost(){
  const s = startWeight(), c = lowestWeight();
  if(s == null || c == null) return 0;
  return Math.max(0, r1(s - c));
}

function weekCheckinRate(start){
  if(!S.habits.length) return 0;
  const want = S.habits.reduce((a,h) => a + (h.target || 7), 0);
  if(!want) return 0;
  const done = S.habits.reduce((a,h) => a + Math.min(habitWeekCount(h.id, start), h.target || 7), 0);
  const t = today(), end = addDays(start, 6);
  let elapsed = 7;
  if(start > t) elapsed = 0;
  else if(end >= t){
    const diff = Math.round((parseD(t) - parseD(start)) / 86400000) + 1;
    elapsed = Math.max(1, Math.min(7, diff));
  }
  const wantNow = want * elapsed / 7;
  if(wantNow <= 0) return 0;
  return Math.min(1, done / wantNow);
}

function weightChartSVG(){
  const a = sortedWeights().slice(-14);
  if(a.length < 2){
    return '<div class="chart-empty">' + icon('chart') + '<br>再记录一次，就能看到你的<br>体重曲线啦</div>';
  }
  const W = 320, H = 150, pl = 34, pr = 12, pt = 16, pb = 26;
  const vals = a.map(w => num(w.kg));
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(max - min < 1){ const m = (max+min)/2; min = m - .6; max = m + .6; }
  const padY = (max - min) * .18;
  min -= padY; max += padY;
  const x = i => pl + (a.length === 1 ? 0 : i * (W - pl - pr) / (a.length - 1));
  const y = v => pt + (max - v) / (max - min) * (H - pt - pb);

  let line = '';
  for(let i = 0; i < a.length; i++){
    const px = x(i), py = y(vals[i]);
    if(i === 0) line += 'M' + px.toFixed(1) + ' ' + py.toFixed(1);
    else{
      const px0 = x(i-1), py0 = y(vals[i-1]);
      const cx = (px0 + px) / 2;
      line += ' C' + cx.toFixed(1) + ' ' + py0.toFixed(1) + ',' + cx.toFixed(1) + ' ' + py.toFixed(1) + ',' + px.toFixed(1) + ' ' + py.toFixed(1);
    }
  }
  const area = line + ' L' + x(a.length-1).toFixed(1) + ' ' + (H-pb) + ' L' + x(0).toFixed(1) + ' ' + (H-pb) + ' Z';

  let grid = '';
  for(let i = 0; i <= 2; i++){
    const gy = pt + i * (H - pt - pb) / 2;
    grid += '<line x1="' + pl + '" y1="' + gy.toFixed(1) + '" x2="' + (W-pr) + '" y2="' + gy.toFixed(1) + '" stroke="#F2EDF3" stroke-width="1" stroke-dasharray="3 5"/>';
  }

  let dots = '', labels = '';
  a.forEach((w, i) => {
    const px = x(i), py = y(vals[i]);
    const isLast = i === a.length - 1;
    dots += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + (isLast ? 4.6 : 3.2) + '" fill="#fff" stroke="' + (isLast ? '#FFAFC5' : '#C6DDFB') + '" stroke-width="2.2"/>';
    if(isLast) dots += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="1.9" fill="#FFAFC5"/>';
    if(i === 0 || isLast || i === Math.floor(a.length/2)){
      labels += '<text x="' + px.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="9" fill="#AAADBE">' + shortLabel(w.d) + '</text>';
    }
  });

  const top = Math.max.apply(null, vals), bottom = Math.min.apply(null, vals);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#FFC9D8" stop-opacity=".45"/><stop offset="100%" stop-color="#DCEBFF" stop-opacity=".06"/>' +
    '</linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#areaGrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#FFAFC5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + labels +
    '<text x="' + (pl-6) + '" y="' + (y(top)+3).toFixed(1) + '" text-anchor="end" font-size="9" fill="#AAADBE">' + top.toFixed(1) + '</text>' +
    '<text x="' + (pl-6) + '" y="' + (y(bottom)+3).toFixed(1) + '" text-anchor="end" font-size="9" fill="#AAADBE">' + bottom.toFixed(1) + '</text>' +
  '</svg>';
}

function renderWeight(){
  const all = sortedWeights();
  const cur = all.length ? num(all[all.length-1].kg) : null;
  const sw = startWeight(), tw = S.profile.target ? num(S.profile.target) : null;

  const toGoal = (cur != null && tw) ? r1(cur - tw) : null;

/* ================= 周报：计算与文案 ================= */
function weekRange(offset){
  let ws = weekStart(today());
  if(offset) ws = addDays(ws, offset * 7);
  return { start: ws, days: weekDates(ws) };
}

function buildReport(offset){
  const { start, days } = weekRange(offset);
  const goal = num(S.profile.kcalGoal) || 1500;

  // 体重
  const wRecs = days.filter(d => weightOn(d)).map(d => ({ d: d, kg: num(weightOn(d).kg) }));
  let wStart = null, wEnd = null;
  if(wRecs.length >= 2){ wStart = wRecs[0].kg; wEnd = wRecs[wRecs.length-1].kg; }
  else if(wRecs.length === 1){
    const prev = prevWeight(wRecs[0].d);
    wStart = prev ? num(prev.kg) : null;
    wEnd = wRecs[0].kg;
  }
  const delta = (wStart != null && wEnd != null) ? r1(wEnd - wStart) : null;

  // 饮食
  const kcalDays = days.map(d => ({ d: d, kcal: dayKcal(d), cnt: dayMealCount(d) })).filter(x => x.kcal > 0);
  const avgKcal = kcalDays.length ? Math.round(kcalDays.reduce((a,x) => a + x.kcal, 0) / kcalDays.length) : 0;
  const maxDay = kcalDays.slice().sort((a,b) => b.kcal - a.kcal)[0] || null;
  const dietRate = kcalDays.length / 7;

  // 打卡
  const rate = weekCheckinRate(start);
  const habitDone = S.habits.reduce((a,h) => a + habitWeekCount(h.id, start), 0);
  const habitWant = S.habits.reduce((a,h) => a + (h.target||7), 0);
  let bestHabit = null, worstHabit = null;
  S.habits.forEach(h => {
    const c = habitWeekCount(h.id, start), t = h.target || 7;
    const ratio = t ? c / t : 0;
    if(!bestHabit || ratio > bestHabit.ratio) bestHabit = { name: h.name, c: c, t: t, ratio: ratio };
    if(!worstHabit || ratio < worstHabit.ratio) worstHabit = { name: h.name, c: c, t: t, ratio: ratio };
  });

  // 分数
  let sTrend, sRecord, sDiet, sHabit;
  if(delta == null) sTrend = 13;
  else if(delta <= -0.8) sTrend = 30;
  else if(delta <= -0.3) sTrend = 27;
  else if(delta < 0.3) sTrend = 22;
  else if(delta < 1) sTrend = 15;
  else sTrend = 8;

  const wDays = wRecs.length;
  sRecord = Math.round(Math.min(1, wDays/7) * 11 + Math.min(1, dietRate) * 14);

  if(!kcalDays.length) sDiet = 9;
  else{
    const r = avgKcal / goal;
    if(avgKcal < goal * 0.6) sDiet = 20;
    else if(r <= 0.88) sDiet = 25;
    else if(r <= 1.02) sDiet = 24;
    else if(r <= 1.12) sDiet = 19;
    else if(r <= 1.28) sDiet = 13;
    else sDiet = 7;
  }
  sHabit = Math.round(Math.min(1, rate) * 20);
  const total = Math.max(0, Math.min(100, sTrend + sRecord + sDiet + sHabit));

  const grade = total >= 92 ? '状态极佳' : total >= 82 ? '非常稳' : total >= 72 ? '在正轨上' : total >= 60 ? '还不错' : '慢慢来';
  const gradeColor = total >= 82 ? '#3C8A6A' : total >= 60 ? '#B5718A' : '#B8526E';

  // 分析文字
  const P = [];
  if(delta == null){
    P.push('这一周体重记录只有 <strong>' + wDays + ' 天</strong>，还不足画出一条趋势线。体重受水分、盐分、生理周期影响，单天数字没有意义，连续记录才看得出方向。');
  }else if(delta < -0.9){
    P.push('本周体重从 <strong>' + wStart.toFixed(1) + ' kg</strong> 降到 <strong>' + wEnd.toFixed(1) + ' kg</strong>，共减 <strong>' + Math.abs(delta).toFixed(1) + ' kg</strong>。这个速度偏快，如果伴随乏力、头晕或掉发，需要适当增加一点主食和蛋白质，减得快不如减得久。');
  }else if(delta < -0.2){
    P.push('本周体重从 <strong>' + wStart.toFixed(1) + ' kg</strong> 到 <strong>' + wEnd.toFixed(1) + ' kg</strong>，下降 <strong>' + Math.abs(delta).toFixed(1) + ' kg</strong>，正好落在每周 0.3~0.8kg 的健康区间里。这种速度最容易保住成果。');
  }else if(delta < 0.2){
    P.push('本周体重基本持平（' + wStart.toFixed(1) + ' kg → ' + wEnd.toFixed(1) + ' kg）。平台期很常见，尤其是身体在适应新的热量水平，先别急着减少进食量，看看围度和衣服的松紧。');
  }else if(delta < 1){
    P.push('本周体重上升了 <strong>' + delta.toFixed(1) + ' kg</strong>。短期上涨大多来自水分与消化物，不用慌，看看是不是吃得偏咸、作息偏晚，或者刚好在生理期前后。');
  }else{
    P.push('本周体重上升了 <strong>' + delta.toFixed(1) + ' kg</strong>，幅度偏大，值得认真回看一下这周的饮食记录与作息。');
  }

  if(kcalDays.length){
    const diff = avgKcal - goal;
    let t = '日均摄入约 <strong>' + avgKcal + ' kcal</strong>，';
    if(Math.abs(diff) <= goal * 0.08) t += '和目标非常接近，节奏把控得很好。';
    else if(diff < 0) t += '比目标低约 ' + Math.abs(diff) + ' kcal。' + (avgKcal < goal * 0.65 ? '吃得太少容易掉肌肉、也容易在某一天报复性进食，建议把热量补回一部分。' : '控制得比较克制，注意蛋白质和蔬菜要吃够。');
    else t += '比目标高约 ' + diff + ' kcal，不算失控，稍微收一收就能回到区间。';
    if(maxDay) t += '其中 <strong>' + WD[parseD(maxDay.d).getDay()] + '</strong> 吃得最多（' + maxDay.kcal + ' kcal），可以留意一下那天的场景。';
    P.push(t);
  }else{
    P.push('本周还没有饮食记录。不记录不等于没吃，但记录能让你看见「不知不觉吃进去」的那部分——这往往就是减不下来的真正原因。');
  }

  if(S.habits.length){
    let t = '已完成 <strong>' + habitDone + ' 次</strong>打卡（本周目标 ' + habitWant + ' 次，进度 <strong>' + Math.round(rate*100) + '%</strong>）。';
    if(bestHabit && bestHabit.c > 0) t += '「' + esc(bestHabit.name) + '」做得最好，' + bestHabit.c + '/' + bestHabit.t + ' 次；';
    if(worstHabit && worstHabit.ratio < 1) t += '「' + esc(worstHabit.name) + '」还差一点，是下周最值得优先补上的一个。';
    P.push(t);
  }

  const summary = total >= 82
    ? '整体看，这周的自律度和记录习惯都在线，继续保持这个节奏就是最好的策略。'
    : total >= 60
      ? '整体看，方向是对的，缺的只是完整度。把记录补全、把最容易的那项打卡守住，分数会明显往上走。'
      : '整体看，这周执行得比较松。别自责，下周只挑 <strong>一件</strong> 最容易做到的事坚持 7 天，就能重新找回节奏。';

  // 建议
  const tips = [];
  if(wDays < 5) tips.push('固定一个时间称重（建议早上起床、上完厕所、空腹），每周至少 5 天，用同一台秤。');
  if(dietRate < 0.6) tips.push('先只要求自己记录「早餐 + 晚餐」两餐，坚持 7 天后再补齐午餐，降低记录门槛。');
  if(kcalDays.length && avgKcal > goal * 1.12) tips.push('把每天热量下调 150~200 kcal：优先减少奶茶、油炸和精制主食，而不是少吃正餐。');
  if(kcalDays.length && avgKcal < goal * 0.65) tips.push('热量吃得太低了，加一份优质蛋白（鸡蛋、鸡胸、豆腐）和半碗主食，避免代谢下降。');
  if(rate < 0.7 && S.habits.length) tips.push('把每周打卡目标下调 1~2 次（比如运动从 4 次改成 3 次），先保证完成率，再谈强度。');
  if(!S.habits.length) tips.push('去「打卡」页添加 3 个简单习惯：喝水、走 6000 步、不吃夜宵。');
  if(delta != null && delta > 0.3) tips.push('这周挑 3 天做 20 分钟快走或居家力量训练，帮助消耗并改善睡眠。');
  tips.push('每天保证 1.5~2L 水与 7 小时睡眠，睡眠不足会直接拉高第二天的食欲。');
  tips.push('把目标写小一点：下周的目标不是「瘦 3 斤」，而是「记录 6 天 + 运动 3 次」。');
  const finalTips = tips.slice(0, 3);

  return {
    start: start, days: days, goal: goal,
    wRecs: wRecs, wStart: wStart, wEnd: wEnd, delta: delta,
    kcalDays: kcalDays, avgKcal: avgKcal, maxDay: maxDay, dietRate: dietRate,
    rate: rate, habitDone: habitDone, habitWant: habitWant, bestHabit: bestHabit, worstHabit: worstHabit,
    dims: [
      { name: '体重趋势', score: sTrend, max: 30 },
      { name: '记录完整度', score: sRecord, max: 25 },
      { name: '饮食控制', score: sDiet, max: 25 },
      { name: '打卡达成', score: sHabit, max: 20 }
    ],
    total: total, grade: grade, gradeColor: gradeColor,
    analysis: P, summary: summary, tips: finalTips
  };
}

/* ================= AI 提示词 ================= */
function buildPrompt(offset){
  const R = buildReport(offset || 0);
  const lines = [];
  lines.push('你是一位专业、温和的体重管理营养师。请基于以下一周数据，为使用者做一份复盘分析。');
  lines.push('要求：');
  lines.push('1. 先用 3~4 句话总结这一周的状态；');
  lines.push('2. 分析体重变化的原因（结合热量、记录频率、打卡情况、可能的平台期/水分因素），不要夸大单日数字；');
  lines.push('3. 给出下周 3 条具体可执行的建议，每条都要能落地（含频率或数量）；');
  lines.push('4. 语气温和、不制造焦虑，不做医学诊断，不使用夸张营销式表达；');
  lines.push('5. 用中文，分小标题，控制在 500 字以内。');
  lines.push('');
  lines.push('【基本信息】');
  lines.push('身高：' + (S.profile.height ? S.profile.height + ' cm' : '未填写'));
  lines.push('起始体重：' + (startWeight() != null ? startWeight().toFixed(1) + ' kg' : '未填写'));
  lines.push('目标体重：' + (S.profile.target ? num(S.profile.target).toFixed(1) + ' kg' : '未填写'));
  lines.push('每日热量目标：' + R.goal + ' kcal');
  lines.push('');
  lines.push('【本周数据】' + R.start + ' ~ ' + addDays(R.start,6));
  lines.push('体重变化：' + (R.delta == null ? '记录不足' : (R.wStart.toFixed(1) + ' → ' + R.wEnd.toFixed(1) + ' kg（' + (R.delta>0?'+':'') + R.delta.toFixed(1) + ' kg）')));
  lines.push('称重天数：' + R.wRecs.length + '/7');
  lines.push('日均热量：' + (R.avgKcal || '未记录') + (R.maxDay ? '，最高为 ' + WD[parseD(R.maxDay.d).getDay()] + ' ' + R.maxDay.kcal + ' kcal' : ''));
  lines.push('打卡完成率：' + Math.round(R.rate*100) + '%（' + R.habitDone + '/' + R.habitWant + ' 次）');
  if(S.habits.length){
    lines.push('各项打卡：' + S.habits.map(h => h.name + ' ' + habitWeekCount(h.id, R.start) + '/' + (h.target||7)).join('；'));
  }
  lines.push('');
  lines.push('【每日明细】');
  R.days.forEach(d => {
    const w = weightOn(d);
    const k = dayKcal(d);
    const ck = S.habits.filter(h => isChecked(d, h.id)).length;
    const notes = [];
    ['breakfast','lunch','dinner'].forEach(key => {
      const m = dayMeals(d)[key];
      if(m && (m.note || num(m.kcal))){
        const nm = MEALS.find(x => x.key === key).name;
        notes.push(nm + (m.note? '：' + m.note : '') + (num(m.kcal) ? '(' + num(m.kcal) + 'kcal)' : ''));
      }
    });
    const snacks = dayMeals(d).snacks;
    if(snacks.length) notes.push('加餐 ' + mealKcal(snacks) + 'kcal' + (snacks.map(s=>s.note).filter(Boolean).length ? '（' + snacks.map(s=>s.note).filter(Boolean).join('、') + '）' : ''));
    lines.push(WD[parseD(d).getDay()] + '：' + (w ? w.kg + 'kg' : '未称重') + '，' + (k ? k + 'kcal' : '无饮食记录') + '，打卡 ' + ck + '/' + S.habits.length + (notes.length ? '，' + notes.join('；') : ''));
  });
  lines.push('');
  lines.push('（本地规则评分参考：' + R.total + ' 分，体重趋势 ' + R.dims[0].score + '/30，记录 ' + R.dims[1].score + '/25，饮食 ' + R.dims[2].score + '/25，打卡 ' + R.dims[3].score + '/20。你可以不同意这个评分，但请给出理由。）');
  return lines.join('\n');
}

async function callAI(offset){
  const box = $('#aiOut');
  const btn = $('#btnAI');
  const cfg = S.ai || {};
  if(!cfg.base || !cfg.key || !cfg.model){
    box.innerHTML = '<span style="color:#B8526E">还没有配置 AI 接口。点右上角齿轮 →「AI 接口」填写，或直接用「复制提示词」粘到任意 AI 里。</span>';
    return;
  }
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const prompt = buildPrompt(offset);
  btn.disabled = true;
  const old = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 分析中…';
  box.innerHTML = '<span style="color:#AAADBE">正在把这一周的数据交给 AI…</span>';
  try{
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({
        model: cfg.model,
        temperature: 0.7,
        messages: [
          { role: 'system', content: '你是一位专业、克制、有共情力的体重管理营养师，说话温和但不含糊。' },
          { role: 'user', content: prompt }
        ]
      })
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 120));
    }
    const data = await res.json();
    const txt = (data.choices && data.choices[0] && (data.choices[0].message && data.choices[0].message.content || data.choices[0].text)) || '';
    if(!txt) throw new Error('返回内容为空');
    box.innerHTML = '<div style="background:#FBF8FC;border-radius:16px;padding:14px">' + esc(txt) + '</div>';
    try{
      S.lastAI = { text: txt, at: Date.now(), week: (offset||0) };
      save();
    }catch(e){}
  }catch(err){
    box.innerHTML = '<span style="color:#B8526E">调用失败：' + esc(err.message || '网络或接口配置有问题') +
      '<br>常见原因：接口不支持浏览器跨域（CORS）、Key 无效、模型名不对。可以改用「复制提示词」。</span>';
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}
/* 根据照片 + 菜名，用视觉模型估算热量 */
async function aiEstimatePhoto(){
  const cfg = S.ai || {};
  if(!cfg.base || !cfg.key || !cfg.model){ toast('先在设置里配置 AI 接口'); return; }
  if(!tmp.photo){ toast('先选一张照片'); return; }
  const btn = document.querySelector('[data-act="ai-vision"]');
  const old = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 识别中…'; }
  const note = $('#mNote') ? $('#mNote').value.trim() : '';
  const prompt = '这是一张饮食照片。请识别图中的食物与大致分量，估算总热量。只输出 JSON，不要任何其他文字，格式：{"items":[{"name":"食物名","kcal":数字}],"total":数字}。' + (note ? '用户补充说明：' + note + '。' : '');
  try{
    const res = await fetch(cfg.base.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({
        model: cfg.model,
        temperature: 0.2,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: prompt },
            { type: 'image_url', image_url: { url: tmp.photo } }
          ]
        }]
      })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const txt = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const m = txt.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('返回内容无法解析');
    const obj = JSON.parse(m[0]);
    const total = Math.round(num(obj.total) || (obj.items || []).reduce((a, x) => a + num(x.kcal), 0));
    if(!total) throw new Error('没识别出热量');
    const names = (obj.items || []).map(x => x.name).filter(Boolean).join(' + ');
    const kEl = $('#mKcal');
    if(kEl){ kEl.value = total; kEl.dataset.auto = '0'; }
    const nEl = $('#mNote');
    if(nEl && names && !nEl.value.trim()) nEl.value = names;
    const tip = $('#foodTip');
    if(tip){ tip.style.display = 'block'; tip.innerHTML = 'AI 估算 ≈ <b>' + total + ' kcal</b>，请按实际分量修改'; }
    toast('AI 估算完成，记得核对');
  }catch(err){
    toast('识别失败：' + (err.message || '当前模型可能不支持图片输入'));
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = old; }
  }
}

/* ================= 图片处理 ================= */
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxSide / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const cvs = document.createElement('canvas');
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(cvs.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.onerror = () => reject(new Error('图片读取失败'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

function pickPhoto(cb){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    try{
      toast('正在压缩照片…');
      const url = await compressImage(f, 760, 0.72);
      cb(url);
    }catch(err){ toast('照片处理失败，换一张试试'); }
    inp.remove();
  });
  inp.click();
}

function pickDate(cur, cb){
  const inp = document.createElement('input');
  inp.type = 'date';
  inp.value = cur || today();
  inp.max = today();
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => { if(inp.value) cb(inp.value); setTimeout(() => inp.remove(), 300); });
  inp.click();
  setTimeout(() => { if(document.body.contains(inp) && !inp.value) inp.remove(); }, 20000);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'go'){ go(el.dataset.view); return; }
  if(act === 'tab'){ go(el.dataset.view); return; }
  if(act === 'close-sheet'){ closeSheet(); return; }
  if(act === 'add-weight'){ openWeightSheet(); return; }
  if(act === 'open-settings'){ openSettings(); return; }

  if(act === 'save-weight'){
    const d = $('#wDate').value || today();
    const kg = num($('#wKg').value);
    if(!kg || kg < 20 || kg > 300){ toast('请输入 20~300 之间的体重'); return; }
    const note = $('#wNote').value.trim();
    const ex = S.weights.find(w => w.d === d);
    if(ex){ ex.kg = r1(kg); ex.note = note; ex.t = Date.now(); }
    else S.weights.push({ id: uid(), d: d, kg: r1(kg), note: note, t: Date.now() });
    save(); closeSheet();
    toast('已记录 ' + r1(kg).toFixed(1) + ' kg');
    renderToday(); renderWeight(); if(currentView === 'achievements') renderAchievements();
    if(currentView === 'report') renderReport();
    return;
  }

  if(act === 'del-weight'){
    const id = el.dataset.id;
    const w = S.weights.find(x => x.id === id);
    if(!w) return;
    if(!confirm('删除 ' + mdLabel(w.d) + ' 的 ' + num(w.kg).toFixed(1) + ' kg 记录？')) return;
    S.weights = S.weights.filter(x => x.id !== id);
    save(); renderWeight(); renderToday();
    toast('已删除');
    return;
  }

  if(act === 'edit-meal' || act === 'edit-snack'){
    const date = el.dataset.date || mealDate;
    const key = act === 'edit-snack' ? 'snacks' : el.dataset.meal;
    const idx = act === 'edit-snack' ? parseInt(el.dataset.idx, 10) : -1;
    openMealSheet(date, key, idx);
    return;
  }
  if(act === 'add-snack'){ openMealSheet(el.dataset.date || mealDate, 'snacks', -1); return; }

  if(act === 'pick-photo'){
    pickPhoto(url => {
      tmp.photo = url;
      const pv = $('#mealPv');
      if(pv) pv.innerHTML = '<img src="' + url + '" alt="">';
    });
    return;
  }
  if(act === 'clear-photo'){
    tmp.photo = null;
    const pv = $('#mealPv');
    if(pv) pv.innerHTML = icon('camera');
    return;
  }
  if(act === 'quick-kcal'){
    const inp = $('#mKcal');
    if(inp) inp.value = el.dataset.k;
    return;
  }

  if(act === 'save-meal'){
    const date = tmp.mealDate || mealDate;
    const kcal = num($('#mKcal') ? $('#mKcal').value : 0);
    const note = $('#mNote') ? $('#mNote').value.trim() : '';
    const photo = tmp.photo;
    const key = tmp.mealKey;
    if(!S.meals[date]) S.meals[date] = {};
    const day = S.meals[date];
    const payload = { photo: photo, kcal: r1(kcal), note: note };
    if(key === 'snacks'){
      if(!Array.isArray(day.snacks)) day.snacks = [];
      if(tmp.snackIdx > -1 && day.snacks[tmp.snackIdx]) day.snacks[tmp.snackIdx] = Object.assign({}, day.snacks[tmp.snackIdx], payload);
      else day.snacks.push(Object.assign({ id: uid() }, payload));
    }else{
      day[key] = Object.assign({}, payload);
    }
    save(); closeSheet();
    if(mealDate === date) renderMeals();
    renderToday();
    toast('已保存这一餐');
    return;
  }

  if(act === 'del-meal'){
    const date = el.dataset.date, key = el.dataset.meal;
    if(S.meals[date] && S.meals[date][key]){
      S.meals[date][key] = null;
      save(); renderMeals(); renderToday(); toast('已删除');
    }
    return;
  }
  if(act === 'del-snack'){
    const date = el.dataset.date, idx = parseInt(el.dataset.idx, 10);
    if(S.meals[date] && Array.isArray(S.meals[date].snacks)){
      S.meals[date].snacks.splice(idx, 1);
      save(); renderMeals(); renderToday(); toast('已删除');
    }
    return;
  }

  if(act === 'meal-day'){
    const delta = parseInt(el.dataset.delta, 10);
    const nd = addDays(mealDate, delta);
    if(nd > today()) return;
    mealDate = nd;
    renderMeals();
    return;
  }
  if(act === 'pick-meal-date'){
    pickDate(mealDate, d => { mealDate = d; renderMeals(); });
    return;
  }

  if(act === 'toggle-check'){
    toggleCheck(el.dataset.date || today(), el.dataset.id);
    if(currentView === 'today') renderToday();
    else if(currentView === 'habits') renderHabits();
    else if(currentView === 'report') renderReport();
    return;
  }

  if(act === 'add-habit'){ openHabitSheet(''); return; }
  if(act === 'edit-habit'){ openHabitSheet(el.dataset.id); return; }
  if(act === 'pick-icon'){
    tmp.habitIcon = el.dataset.i;
    $$('#hIcons .chip').forEach(c => c.classList.toggle('on', c.dataset.i === tmp.habitIcon));
    return;
  }
  if(act === 'pick-target'){
    $$('#hTargets .chip').forEach(c => c.classList.toggle('on', c.dataset.n === el.dataset.n));
    return;
  }
  if(act === 'save-habit'){
    const name = $('#hName').value.trim();
    if(!name){ toast('先给这个习惯起个名字'); return; }
    const onChip = $('#hTargets .chip.on');
    const target = onChip ? parseInt(onChip.dataset.n, 10) : 7;
    const id = el.dataset.id;
    if(id){
      const h = S.habits.find(x => x.id === id);
      if(h){ h.name = name; h.icon = tmp.habitIcon; h.target = target; }
    }else{
      S.habits.push({ id: uid(), name: name, icon: tmp.habitIcon, target: target });
    }
    save(); closeSheet(); renderHabits(); renderToday();
    toast('已保存');
    return;
  }
  if(act === 'del-habit'){
    const id = el.dataset.id;
    if(!id) return;
    if(!confirm('删除这个打卡事项？历史打卡记录也会一起移除。')) return;
    S.habits = S.habits.filter(h => h.id !== id);
    Object.keys(S.checkins).forEach(d => {
      S.checkins[d] = (S.checkins[d] || []).filter(x => x !== id);
    });
    save(); closeSheet(); renderHabits(); renderToday();
    toast('已删除');
    return;
  }

  if(act === 'badge-info'){
    const kgNum = parseInt(el.dataset.kg, 10);
    const b = badgeAt(kgNum);
    const on = totalLost() >= kgNum;
    openSheet(
      '<h3>' + b.name + '</h3><p class="sheet-sub">减重 ' + kgNum + ' kg 徽章</p>' +
      '<div class="row" style="gap:14px;padding:6px 0 4px">' +
        '<div class="badge ' + (on?'on':'locked') + '" style="width:74px;height:74px;flex:0 0 74px;border-radius:20px">' + icon(b.icon) + '</div>' +
        '<div class="grow" style="font-size:13px;line-height:1.8;color:#7B7E90">' +
          (on ? '已解锁。累计减重达到 ' + kgNum + ' kg 时获得。' : '还差 <b style="color:#A9546C">' + Math.max(0, (kgNum - totalLost())).toFixed(1) + ' kg</b> 解锁。') +
          '<br>当前累计减重 <b>' + totalLost().toFixed(1) + ' kg</b>。' +
        '</div>' +
      '</div>' +
      '<div class="hint" style="margin-top:10px">徽章以历史最低体重计算，短期浮动不会让它消失。</div>' +
      '<div class="sheet-actions"><button class="btn btn-primary" data-act="close-sheet">知道啦</button></div>'
    );
    return;
  }

  if(act === 'report-week'){
    const delta = parseInt(el.dataset.delta, 10);
    const next = reportWeekOffset + delta;
    if(next > 0) return;
    reportWeekOffset = next;
    renderReport();
    return;
  }

  if(act === 'ai-analyze'){ await callAI(reportWeekOffset); return; }
  if(act === 'ai-vision'){ await aiEstimatePhoto(); return; }
  if(act === 'copy-prompt'){
    const text = buildPrompt(reportWeekOffset);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
      else{
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      toast('提示词已复制，去粘给 AI 吧');
    }catch(err){
      toast('复制失败，请手动选择文本');
    }
    return;
  }

  if(act === 'pick-goal'){
    const inp = $('#sKcal');
    if(inp) inp.value = el.dataset.k;
    return;
  }

  if(act === 'save-settings'){
    S.profile.nickname = $('#sNick').value.trim();
    S.profile.height = num($('#sHeight').value) || null;
    S.profile.start = num($('#sStart').value) || null;
    S.profile.target = num($('#sTarget').value) || null;
    S.profile.kcalGoal = num($('#sKcal').value) || 1500;
    S.ai = { base: $('#aiBase').value.trim(), model: $('#aiModel').value.trim(), key: $('#aiKey').value.trim() };
    save(); closeSheet();
    renderView(currentView);
    toast('设置已保存');
    return;
  }

  if(act === 'export-data'){
    try{
      const data = JSON.stringify(S, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '轻盈日记-备份-' + today() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      toast('已导出备份文件');
    }catch(err){ toast('导出失败'); }
    return;
  }
  if(act === 'import-data'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const d = JSON.parse(rd.result);
          if(!d || !Array.isArray(d.weights)) throw new Error('格式不对');
          S = Object.assign(DEFAULT(), d);
          S.profile = Object.assign(DEFAULT().profile, d.profile || {});
          S.ai = Object.assign({base:'',key:'',model:''}, d.ai || {});
          save(); closeSheet(); renderView(currentView);
          toast('导入成功');
        }catch(err){ toast('导入失败：文件格式不正确'); }
      };
      rd.readAsText(f);
      inp.remove();
    });
    inp.click();
    return;
  }
  if(act === 'clear-data'){
    if(!confirm('确定清空所有数据？此操作不可恢复，建议先导出备份。')) return;
    if(!confirm('再确认一次：体重、饮食、打卡记录都会被删除。')) return;
    S = DEFAULT();
    try{ localStorage.removeItem(KEY); }catch(e){}
    save(); closeSheet(); go('today');
    toast('已清空');
    return;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(!t || !t.id) return;
  if(t.id === 'mKcal'){ t.dataset.auto = '0'; return; }
  if(t.id !== 'mNote') return;
  clearTimeout(window.__foodTimer);
  window.__foodTimer = setTimeout(() => {
    const tip = $('#foodTip'), kEl = $('#mKcal');
    if(!tip || !kEl) return;
    const hits = estimateFoods(t.value);
    if(hits.length){
      const sum = hits.reduce((a, h) => a + h.kcal, 0);
      tip.style.display = 'block';
      tip.innerHTML = '按 ' + hits.map(h => '「' + esc(h.name) + '」' + (hits.length > 1 ? ' ' + h.kcal : '')).join(' + ') +
        ' 估算 ≈ <b>' + sum + ' kcal</b>，可手动修改';
      if(!kEl.value || kEl.dataset.auto === '1'){
        kEl.value = sum;
        kEl.dataset.auto = '1';
      }
    }else{
      tip.style.display = 'none';
      if(kEl.dataset.auto === '1'){ kEl.value = ''; kEl.dataset.auto = '0'; }
    }
  }, 320);
});

$('#sheetMask').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
document.addEventListener('focusin', e => {
  if(e.target && e.target.closest && e.target.closest('.sheet')){
    setTimeout(() => { try{ e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }catch(err){} }, 300);
  }
});

/* ================= 初始化 ================= */
(function init(){
  $('#brandMark').innerHTML = icon('leaf');
  $('#btnSettings').innerHTML = icon('gear');
  $('#btnSettings').addEventListener('click', openSettings);

  const TABS = [
    { view:'today', label:'今天', icon:'sun' },
    { view:'weight', label:'体重', icon:'scale' },
    { view:'meals', label:'饮食', icon:'bowl' },
    { view:'habits', label:'打卡', icon:'check' },
    { view:'report', label:'周报', icon:'chart' }
  ];
  $('#tabbar').innerHTML = TABS.map(t =>
    '<button class="tab" data-act="tab" data-view="' + t.view + '">' + icon(t.icon) + '<span>' + t.label + '</span></button>'
  ).join('');

  load();

  // 离线缓存（仅 http/https 生效，file:// 打开会自动跳过）
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // 首次使用引导：如果什么都没填，弹一次设置
  const first = !S.profile.start && !S.weights.length && !S.profile.target;
  go('today');
  if(first){
    setTimeout(() => {
      openSettings();
      toast('先填一下起始体重和目标，体验会更完整');
    }, 500);
  }
})();

</script>
</body>
</html>
